plugins {
    id "com.android.application"
}

android {
    namespace "vip.thatiam.mml"
    compileSdk 35

    defaultConfig {
        applicationId "vip.thatiam.mml"
        minSdk 33
        targetSdk 35
        versionCode 15
        versionName "1.6.6"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
